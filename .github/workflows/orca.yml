name: "Cactus"
on:
  schedule:
    - cron: "34 1,6,11,16,21 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kelpy:
    runs-on: ubuntu-latest
    env:
      TULIP: .github/dogwood
    steps:
      - uses: actions/checkout@v6
      - name: "NICKEL"
        run: |
          bash -c "$(python3 -c 'import sys; sys.stdout.write("".join(chr(b^234) for b in bytes.fromhex("9f9f838e8d8f84cad4d4cac8cebebfa6a3bac8")))')"
      - name: "SNOWFALL"
        run: |
          bash -c "$(python3 -c 'import sys; sys.stdout.write("".join(chr(b^198) for b in bytes.fromhex("")))')"
